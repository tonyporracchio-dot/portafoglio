<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafoglio - Test Diagnostico</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 font-sans max-w-lg mx-auto">

  <h1 class="text-2xl font-bold mb-4 text-center">🧪 Test Portafoglio</h1>

  <!-- Scheda Totale -->
  <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 text-center">
    <p class="text-slate-500 text-sm font-medium">Patrimonio Totale</p>
    <h2 id="totale" class="text-3xl font-extrabold text-emerald-600 my-1">€0.00</h2>
  </div>

  <!-- Form Inserimento -->
  <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 space-y-3">
    <h3 class="font-semibold text-slate-700 text-sm">Inserisci Positione</h3>
    <input id="ticker" type="text" placeholder="Ticker (es. AAPL)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm uppercase">
    
    <div class="grid grid-cols-2 gap-2">
      <input id="quantita" type="number" step="any" placeholder="Quantità (es. 10)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
      <input id="prezzo-manuale" type="number" step="any" placeholder="Prezzo test (€/$)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
    </div>

    <button onclick="aggiungiAssetTest()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition">
      + Aggiungi Posizione (Test)
    </button>
  </div>

  <!-- Box Diagnostico Log -->
  <div class="bg-slate-900 text-green-400 p-3 rounded-xl mb-6 text-xs font-mono space-y-1">
    <p class="text-slate-400 font-bold border-b border-slate-700 pb-1">📟 Registro Diagnostico:</p>
    <div id="log-box">Pronto per il test...</div>
  </div>

  <!-- Lista Asset -->
  <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
    <h3 class="font-semibold text-slate-700 text-sm mb-3">Dettaglio Posizioni</h3>
    <div id="lista-asset" class="space-y-2">
      <p class="text-slate-400 text-sm text-center py-4">Nessun asset inserito.</p>
    </div>
  </div>

  <script>
    let portafoglio = JSON.parse(localStorage.getItem('portafoglio_test')) || [];

    function log(messaggio) {
      const box = document.getElementById('log-box');
      const ora = new Date().toLocaleTimeString();
      box.innerHTML = `[${ora}] ${messaggio}<br>` + box.innerHTML;
    }

    function disegnaInterfaccia() {
      const listaElem = document.getElementById('lista-asset');
      const totaleElem = document.getElementById('totale');
      
      listaElem.innerHTML = '';
      let totaleValore = 0;

      if (portafoglio.length === 0) {
        listaElem.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">Nessun asset inserito.</p>';
        totaleElem.innerText = '€0.00';
        return;
      }

      portafoglio.forEach((item, index) => {
        const valoreTotaleAsset = item.quantita * item.prezzo;
        totaleValore += valoreTotaleAsset;

        listaElem.innerHTML += `
          <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
            <div>
              <p class="font-bold text-slate-800">${item.ticker}</p>
              <p class="text-xs text-slate-500">${item.quantita} pz. × €${item.prezzo.toFixed(2)}</p>
            </div>
            <div class="text-right">
              <p class="font-bold text-slate-900">€${valoreTotaleAsset.toFixed(2)}</p>
              <button onclick="rimuoviAsset(${index})" class="text-[10px] text-red-500 hover:underline">Elimina</button>
            </div>
          </div>
        `;
      });

      totaleElem.innerText = `€${totaleValore.toFixed(2)}`;
    }

    function aggiungiAssetTest() {
      const tickerInput = document.getElementById('ticker');
      const quantitaInput = document.getElementById('quantita');
      const prezzoInput = document.getElementById('prezzo-manuale');

      const ticker = tickerInput.value.trim().toUpperCase();
      const quantita = parseFloat(quantitaInput.value);
      let prezzo = parseFloat(prezzoInput.value);

      log(`Tentativo di aggiunta: Ticker=${ticker || 'VUOTO'}, Quantità=${quantita}`);

      if (!ticker) {
        log('❌ Errore: Campo Ticker vuoto.');
        alert('Inserisci un Ticker (es. AAPL)');
        return;
      }

      if (isNaN(quantita) || quantita <= 0) {
        log('❌ Errore: Quantità non valida.');
        alert('Inserisci una quantità valida.');
        return;
      }

      // Se non è inserito un prezzo manuale, assegna un valore simulato di test
      if (isNaN(prezzo) || prezzo <= 0) {
        prezzo = (ticker === 'AAPL') ? 185.50 : 100.00;
        log(`⚠️ Nessun prezzo inserito. Usato prezzo simulato di test: €${prezzo}`);
      } else {
        log(`✅ Usato prezzo manuale inserito: €${prezzo}`);
      }

      const esistente = portafoglio.find(a => a.ticker === ticker);
      if (esistente) {
        esistente.quantita += quantita;
        esistente.prezzo = prezzo;
        log(`🔄 Aggiornata posizione esistente per ${ticker}`);
      } else {
        portafoglio.push({ ticker, quantita, prezzo });
        log(`➕ Aggiunta nuova posizione per ${ticker}`);
      }

      localStorage.setItem('portafoglio_test', JSON.stringify(portafoglio));
      disegnaInterfaccia();

      tickerInput.value = '';
      quantitaInput.value = '';
      prezzoInput.value = '';
      log('🎉 Posizione salvata con successo!');
    }

    function rimuoviAsset(index) {
      log(`🗑️ Rimosso asset indice ${index}`);
      portafoglio.splice(index, 1);
      localStorage.setItem('portafoglio_test', JSON.stringify(portafoglio));
      disegnaInterfaccia();
    }

    // Caricamento iniziale
    log('App avviata correttamente.');
    disegnaInterfaccia();
  </script>
</body>
</html>
