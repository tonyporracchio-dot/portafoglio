<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grafico da CSV Google Sheets</title>
  <!-- Chart.js da CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .status {
      font-size: 0.875rem;
      color: #94a3b8;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 420px;
    }

    #error-msg {
      display: none;
      color: #f87171;
      background-color: rgba(239, 68, 68, 0.1);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Andamento Dati CSV</h1>
      <span id="status" class="status">Caricamento in corso...</span>
    </header>

    <div id="error-msg"></div>

    <div class="chart-box">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <script>
    // URL CSV generato da Google Sheets
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSh-PJ8uff324g2SKnIxq4UnXCWVJjl-wer-CDciNP3xXHTFCdX_FIumP5NA2I8XpWqRXL2gHoMKTq/pub?output=csv';

    async function initChart() {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error-msg');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error(`Errore HTTP ${response.status}`);

        const csvText = await response.text();
        const { labels, data } = parseCSV(csvText);

        if (labels.length === 0) {
          throw new Error('Nessun dato valido trovato nel CSV.');
        }

        renderChart(labels, data);
        statusEl.innerText = `Dati caricati (${labels.length} punti)`;
        statusEl.style.color = '#34d399';
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Errore di caricamento';
        statusEl.style.color = '#f87171';
        errorEl.innerText = 'Impossibile caricare il grafico: ' + err.message;
        errorEl.style.display = 'block';
      }
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      const labels = [];
      const data = [];

      // Salta la prima riga (intestazione)
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        // Gestisce la divisione per virgola o punto e virgola
        const cols = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)|;/);

        if (cols.length >= 2) {
          let label = cols[0].replace(/"/g, '').trim();
          let valueStr = cols[1].replace(/"/g, '').trim();

          // Sostituisce la virgola decimale con il punto
          valueStr = valueStr.replace(',', '.');

          const val = parseFloat(valueStr);
          if (!isNaN(val)) {
            labels.push(label);
            data.push(val);
          }
        }
      }

      return { labels, data };
    }

    function renderChart(labels, data) {
      const ctx = document.getElementById('myChart').getContext('2d');

      // Gradiente per lo sfondo sotto la linea
      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
      gradient.addColorStop(1, 'rgba(56, 189, 248, 0.0)');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Valore',
            data: data,
            borderColor: '#38bdf8',
            backgroundColor: gradient,
            borderWidth: 2,
            fill: true,
            tension: 0.25,
            pointRadius: 3,
            pointHoverRadius: 6,
            pointBackgroundColor: '#38bdf8'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false // Nascosta per un design più pulito
            },
            tooltip: {
              mode: 'index',
              intersect: false
            }
          },
          scales: {
            x: {
              ticks: { color: '#94a3b8' },
              grid: { color: '#334155' }
            },
            y: {
              ticks: { color: '#94a3b8' },
              grid: { color: '#334155' }
            }
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initChart);
  </script>
</body>
</html>
