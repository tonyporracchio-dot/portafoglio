<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Grafico CSV Dinamico</title>
  <!-- Chart.js da CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --accent-color: #0ea5e9;
      --accent-hover: #0284c7;
      --color-ds1: #38bdf8; /* Prima serie */
      --color-ds2: #a855f7; /* Seconda serie */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: var(--text-sub);
    }

    /* Barra Configurazione URL */
    .url-config {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .url-config input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-config input:focus {
      border-color: var(--accent-color);
    }

    .url-config button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .url-config button:hover {
      background: var(--accent-hover);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 420px;
    }

    #error-msg {
      display: none;
      color: #f87171;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Visualizzatore Dati CSV</h1>
      <p class="subtitle">Inserisci il link di esportazione CSV del tuo Google Sheet</p>
    </header>

    <!-- Controllo URL CSV -->
    <div class="url-config">
      <input 
        type="text" 
        id="csvUrlInput" 
        placeholder="Incolla URL CSV qui..."
        value="https://docs.google.com/spreadsheets/d/e/2PACX-1vTSh-PJ8uff324g2SKnIxq4UnXCWVJjl-wer-CDciNP3xXHTFCdX_FIumP5NA2I8XpWqRXL2gHoMKTq/pub?gid=2116695106&single=true&output=csv"
      />
      <button id="loadBtn">Carica Grafico</button>
    </div>

    <div class="status-bar">
      <span id="status">In attesa...</span>
    </div>

    <div id="error-msg"></div>

    <div class="chart-box">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <script>
    let chartInstance = null; // Mantiene il riferimento per distruggere il vecchio grafico al ricaricamento

    // Recupera l'URL salvato in precedenza o usa quello predefinito
    const defaultUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSh-PJ8uff324g2SKnIxq4UnXCWVJjl-wer-CDciNP3xXHTFCdX_FIumP5NA2I8XpWqRXL2gHoMKTq/pub?gid=2116695106&single=true&output=csv';
    const savedUrl = localStorage.getItem('user_csv_url');
    
    const inputEl = document.getElementById('csvUrlInput');
    if (savedUrl) {
      inputEl.value = savedUrl;
    } else {
      inputEl.value = defaultUrl;
    }

    document.getElementById('loadBtn').addEventListener('click', () => {
      const url = inputEl.value.trim();
      if (url) {
        localStorage.setItem('user_csv_url', url);
        loadAndRenderChart(url);
      }
    });

    async function loadAndRenderChart(url) {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error-msg');

      errorEl.style.display = 'none';
      statusEl.innerText = 'Caricamento dati in corso...';
      statusEl.style.color = '#94a3b8';

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Errore di connessione (${response.status})`);

        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        if (parsedData.labels.length === 0) {
          throw new Error('Nessuna riga di dati valida trovata nel file CSV.');
        }

        renderChart(parsedData);
        statusEl.innerText = `Grafico aggiornato (${parsedData.labels.length} punti dati caricati)`;
        statusEl.style.color = '#34d399';
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Errore nel caricamento';
        statusEl.style.color = '#f87171';
        errorEl.innerText = 'Impossibile elaborare il grafico: ' + err.message;
        errorEl.style.display = 'block';
      }
    }

    function cleanNumber(str) {
      if (!str) return null;
      let clean = str.replace(/"/g, '').replace(/€/g, '').replace(/\s/g, '').trim();
      if (clean.includes(',') && clean.includes('.')) {
        clean = clean.replace(/\./g, '').replace(',', '.');
      } else if (clean.includes(',')) {
        clean = clean.replace(',', '.');
      }
      const num = parseFloat(clean);
      return isNaN(num) ? null : num;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length === 0) return { labels: [], datasets: [] };

      // Intestazioni (Riga 0)
      const headerCols = lines[0].split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)|;/);
      const labelName = headerCols[0] ? headerCols[0].replace(/"/g, '').trim() : 'Mese';
      const ds1Name = headerCols[1] ? headerCols[1].replace(/"/g, '').trim() : 'Serie 1';
      const ds2Name = headerCols[2] ? headerCols[2].replace(/"/g, '').trim() : 'Serie 2';

      const labels = [];
      const data1 = [];
      const data2 = [];

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const cols = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)|;/);

        if (cols.length >= 2) {
          const lbl = cols[0].replace(/"/g, '').trim();
          const val1 = cleanNumber(cols[1]);
          const val2 = cols.length >= 3 ? cleanNumber(cols[2]) : null;

          if (lbl && (val1 !== null || val2 !== null)) {
            labels.push(lbl);
            data1.push(val1);
            data2.push(val2);
          }
        }
      }

      const datasets = [
        {
          label: ds1Name,
          data: data1,
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          borderWidth: 2.5,
          tension: 0.3,
          pointRadius: 4,
          pointHoverRadius: 7,
          pointBackgroundColor: '#38bdf8'
        }
      ];

      // Se esiste la colonna C, aggiunge il secondo dataset
      if (data2.some(v => v !== null)) {
        datasets.push({
          label: ds2Name,
          data: data2,
          borderColor: '#a855f7',
          backgroundColor: 'rgba(168, 85, 247, 0.1)',
          borderWidth: 2.5,
          tension: 0.3,
          pointRadius: 4,
          pointHoverRadius: 7,
          pointBackgroundColor: '#a855f7'
        });
      }

      return { labels, datasets, labelName };
    }

    function renderChart(parsedData) {
      const ctx = document.getElementById('myChart').getContext('2d');

      // Distrugge il vecchio grafico se esiste prima di crearne uno nuovo
      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: parsedData.labels,
          datasets: parsedData.datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: {
              position: 'top',
              labels: {
                color: '#f8fafc',
                font: { size: 13 },
                usePointStyle: true,
                padding: 20
              }
            },
            tooltip: {
              backgroundColor: '#1e293b',
              titleColor: '#f8fafc',
              bodyColor: '#cbd5e1',
              borderColor: '#334155',
              borderWidth: 1,
              padding: 12
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: parsedData.labelName,
                color: '#94a3b8'
              },
              ticks: { color: '#94a3b8' },
              grid: { color: '#334155' }
            },
            y: {
              title: {
                display: true,
                text: 'Valore',
                color: '#94a3b8'
              },
              ticks: { color: '#94a3b8' },
              grid: { color: '#334155' }
            }
          }
        }
      });
    }

    // Carica automaticamente all'avvio
    document.addEventListener('DOMContentLoaded', () => {
      loadAndRenderChart(inputEl.value.trim());
    });
  </script>
</body>
</html>
