<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiornamento Liquidità</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .widget-container {
            max-width: 350px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h3 {
            margin-top: 0;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Assicura che il padding non allarghi l'input */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #risultatoVariazione {
            margin-top: 15px;
            font-size: 15px;
            color: #333;
        }
        .valore-positivo {
            color: #28a745;
            font-weight: bold;
        }
        .valore-negativo {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <h3>Liquidità Attuale</h3>
        
        <label for="inputLiquidita">Totale Liquidità (€):</label>
        <input type="number" id="inputLiquidita" placeholder="Es. 15000" step="0.01">
        
        <button onclick="aggiornaLiquidita()">Aggiorna</button>

        <!-- Il risultato apparirà qui sotto -->
        <div id="risultatoVariazione"></div>
    </div>

    <script>
        // Simulazione del dato precedentemente salvato.
        // Nel progetto reale, questo valore verrà letto dal tuo database Firebase
        // prima di eseguire il calcolo.
        let liquiditaMesePrecedente = 10000; 

        function aggiornaLiquidita() {
            // Legge il valore dall'input
            let inputVal = document.getElementById('inputLiquidita').value;
            let nuovaLiquidita = parseFloat(inputVal);

            // Controllo per evitare errori se il campo è vuoto o non numerico
            if (isNaN(nuovaLiquidita)) {
                document.getElementById('risultatoVariazione').innerHTML = "<span class='valore-negativo'>Inserisci un valore numerico.</span>";
                return;
            }

            // Calcoli
            let variazioneEuro = nuovaLiquidita - liquiditaMesePrecedente;
            let variazionePercentuale = (variazioneEuro / liquiditaMesePrecedente) * 100;

            // Formattazione
            let segno = variazioneEuro > 0 ? "+" : "";
            let classeColore = variazioneEuro >= 0 ? "valore-positivo" : "valore-negativo";

            // Creazione del testo finale in HTML
            let testoVariazione = `Variazione mensile:<br> 
                <span class="${classeColore}">
                    ${segno}${variazioneEuro.toFixed(2)} € (${segno}${variazionePercentuale.toFixed(2)}%)
                </span>`;

            // Aggiornamento della pagina
            document.getElementById('risultatoVariazione').innerHTML = testoVariazione;

            // TODO: Inserire qui la logica di aggiornamento per Firebase
            // Esempio:
            // database.ref('utenti/liquidita').set(nuovaLiquidita);
        }
    </script>

</body>
</html>
